<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Dr. Mario 99 - Controller</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex">
    <script>
        // Phones: a double tap or a pinch must never zoom the game. iOS ignores user-scalable=no,
        // so stop it here too. Buttons and text boxes need their taps, and touch-action covers them.
        (function () {
            let lastTap = 0;
            document.addEventListener('touchend', (e) => {
                const now = Date.now();
                const quick = now - lastTap < 350;
                lastTap = now;
                if (quick && e.cancelable && !e.target.closest('button, a, input, textarea, select, label')) e.preventDefault();
            }, { passive: false });
            document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
            --accent: #00ffff;
            --accent-soft: rgba(0, 255, 255, 0.35);
        }
        /* No double-tap zoom anywhere (see the script at the top of this page) */
        html, body * { touch-action: manipulation; }
        /* Player colours: same list as the TV (index.html .tv-p1 ... and attackFx.js) */
        body.p1 { --accent: #ff4d6d; --accent-soft: rgba(255, 77, 109, 0.35); }
        body.p2 { --accent: #4dc3ff; --accent-soft: rgba(77, 195, 255, 0.35); }
        body.p3 { --accent: #ffd60a; --accent-soft: rgba(255, 214, 10, 0.35); }
        body.p4 { --accent: #00ff66; --accent-soft: rgba(0, 255, 102, 0.3); }
        body.p5 { --accent: #c77dff; --accent-soft: rgba(199, 125, 255, 0.35); }
        body.p6 { --accent: #ff9f1c; --accent-soft: rgba(255, 159, 28, 0.35); }
        body.p7 { --accent: #2ee6d6; --accent-soft: rgba(46, 230, 214, 0.35); }
        body.p8 { --accent: #ff70d9; --accent-soft: rgba(255, 112, 217, 0.35); }
        body.p9 { --accent: #f1f5f9; --accent-soft: rgba(241, 245, 249, 0.35); }
        body.p10 { --accent: #b4ff39; --accent-soft: rgba(180, 255, 57, 0.35); }
        body.p11 { --accent: #8093ff; --accent-soft: rgba(128, 147, 255, 0.35); }
        body.p12 { --accent: #ff8a6b; --accent-soft: rgba(255, 138, 107, 0.35); }
        body.p13 { --accent: #d9a066; --accent-soft: rgba(217, 160, 102, 0.35); }
        body.p14 { --accent: #8dffcf; --accent-soft: rgba(141, 255, 207, 0.35); }
        body.p15 { --accent: #e040fb; --accent-soft: rgba(224, 64, 251, 0.35); }
        body.p16 { --accent: #c9a227; --accent-soft: rgba(201, 162, 39, 0.35); }
        body.p17 { --accent: #a8e6ff; --accent-soft: rgba(168, 230, 255, 0.35); }
        body.p18 { --accent: #ffb3c7; --accent-soft: rgba(255, 179, 199, 0.35); }
        body.p19 { --accent: #d7c4ff; --accent-soft: rgba(215, 196, 255, 0.35); }
        body.p20 { --accent: #9aa93a; --accent-soft: rgba(154, 169, 58, 0.35); }

        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
            text-align: center;
        }
        .hidden { display: none !important; }

        .badge {
            display: inline-block;
            border: 3px solid var(--accent);
            color: var(--accent);
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            text-shadow: 0 0 8px var(--accent);
            box-shadow: 0 0 18px var(--accent-soft);
        }
        h1 {
            font-size: 20px;
            line-height: 1.5;
            color: #00ffff;
            text-shadow: 0 0 12px #00ffff;
        }
        p { font-size: 11px; line-height: 1.8; color: #cfd8ff; max-width: 320px; }

        #nameForm { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 320px; }
        #nameInput {
            font-family: inherit;
            font-size: 16px; /* 16px stops iOS from zooming on focus */
            padding: 16px;
            border-radius: 12px;
            border: 3px solid var(--accent);
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            text-align: center;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }
        .big-button {
            font-family: inherit;
            font-size: 16px;
            padding: 18px;
            border-radius: 14px;
            border: 3px solid #fff;
            color: #fff;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            cursor: pointer;
        }
        .big-button:disabled { opacity: 0.5; }
        .error { color: #ff6b6b; font-size: 11px; min-height: 1em; line-height: 1.6; }

        /* Controller.
           Buttons only in the bottom 60% of the screen, where a thumb reaches
           without looking; the top 40% is just who you are. With the game on the
           phone, the top part is the board and the buttons take the bottom half. */
        #controllerScreen {
            justify-content: stretch;
            gap: 0;
            padding: 0;
        }
        .controller-info {
            flex: 0 0 40%;
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: max(12px, env(safe-area-inset-top)) 12px 12px;
            gap: 10px;
            min-height: 0;
        }
        .controller-info .big-name {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-size: 24px;
            color: var(--accent);
            text-shadow: 0 0 14px var(--accent);
            max-width: 100%;
        }
        .controller-info .big-name small { font-size: 10px; color: #9fb3ff; text-shadow: none; }
        .controller-info .big-name .target { color: #fff; text-shadow: none; }
        .controller-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
            font-size: 12px;
        }
        .controller-top .top-name {
            display: none;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--accent);
            text-align: center;
        }
        .controller-info .big-name span {
            /* room for the glow, so cutting off a long name doesn't clip it into a box */
            padding: 16px;
            margin: -16px 0;
            box-sizing: border-box;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .pad {
            flex: 0 0 60%;
            width: 100%;
            padding: 0 12px max(12px, env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 0.62fr 1fr 1fr 1.05fr;
            gap: 10px;
            touch-action: none;
            min-height: 0;
        }
        .pad button {
            font-family: inherit;
            border-radius: 20px;
            border: 4px solid var(--c);
            color: var(--c);
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            box-shadow: 0 6px 20px var(--glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            touch-action: none;
            transition: transform 0.05s, background 0.05s;
            min-height: 0;
        }
        .pad button svg { width: 48px; height: 48px; flex: none; stroke: currentColor; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .pad button.down { transform: scale(0.95); background: var(--glow); }
        .pad .rotate { --c: #ff00ff; --glow: rgba(255, 0, 255, 0.35); }
        .pad .move { --c: #00ff66; --glow: rgba(0, 255, 102, 0.3); }
        .pad .drop { --c: #ff4444; --glow: rgba(255, 68, 68, 0.35); grid-column: 1 / span 2; }
        /* HOLD: shows the pill in the hold box on the button itself */
        .pad .hold {
            --c: #ffd60a; --glow: rgba(255, 214, 10, 0.3);
            grid-column: 1 / span 2;
            flex-direction: row;
            gap: 16px;
            font-size: 14px;
        }
        .pad .hold .hold-box {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 64px;
            height: 36px;
            padding: 0 6px;
            border: 2px solid currentColor;
            border-radius: 8px;
            background: #000;
        }
        .pad .hold .hold-box img { width: 24px; height: 24px; image-rendering: pixelated; }
        .pad .hold .hold-box .empty { font-size: 9px; opacity: 0.6; }
        .pad .hold.used { opacity: 0.45; }

        /* The player's own board, when the TV sends it (Show Game on Phone Screen) */
        .phone-game { display: none; }
        #controllerScreen.show-game .controller-info { flex: 0 0 auto; padding-bottom: 6px; }
        #controllerScreen.show-game .controller-info .big-name { display: none; }
        #controllerScreen.show-game .controller-top .top-name { display: block; }
        #controllerScreen.show-game .phone-game {
            flex: 1 1 0;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 10px;
            padding: 0 12px 10px;
        }
        #controllerScreen.show-game .pad { flex: 0 0 50%; grid-template-rows: 0.78fr 1fr 1fr 1fr; }
        #controllerScreen.show-game .pad button svg { width: 34px; height: 34px; }
        #controllerScreen.show-game .pad button { gap: 4px; font-size: 9px; border-radius: 16px; }
        .phone-game .side {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            font-size: 9px;
            color: #9fb3ff;
        }
        .phone-game .side.left { align-items: flex-end; text-align: right; }
        .phone-game .side.right { align-items: flex-start; text-align: left; }
        .phone-game .side b { display: block; margin-top: 6px; font-weight: normal; font-size: 12px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
        .phone-game .next { display: flex; margin-top: 6px; }
        .phone-game .next img { width: 20px; height: 20px; image-rendering: pixelated; }
        .phone-game .board-wrap { flex: none; height: 100%; display: flex; align-items: center; justify-content: center; }
        .phone-game .board-wrap { position: relative; }
        /* Junk on its way: where and what it will be, see-through and blinking until it drops */
        .junk-layer { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; }
        .junk-layer img { position: absolute; top: calc(100% / 17); width: 12.5%; height: calc(100% / 17); image-rendering: pixelated; animation: junkBlink 0.45s ease-in-out infinite alternate; }
        @keyframes junkBlink { from { opacity: 0.3; } to { opacity: 0.9; } }
        #boardCanvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            border: 3px solid var(--accent);
            border-radius: 6px;
            box-shadow: 0 0 18px var(--accent-soft);
        }

        /* Attack flashes */
        .fx-flash {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
            background: radial-gradient(ellipse at center, transparent 20%, var(--fx-bg) 100%);
            box-shadow: inset 0 0 60px 20px var(--fx);
        }
        .fx-flash span {
            width: 100%;
            padding: 22px 0;
            text-align: center;
            font-size: 26px;
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            border-top: 4px solid var(--fx);
            border-bottom: 4px solid var(--fx);
            text-shadow: 0 0 12px var(--fx), 3px 3px 0 #000;
        }
        /* With the board on screen, don't hide it behind the banner for long */
        body.show-game .fx-flash { background: none; }
        body.show-game .fx-flash span { background: rgba(0, 0, 0, 0.5); padding: 12px 0; font-size: 20px; }
        .fx-flash.attack { --fx: #00ff66; --fx-bg: rgba(0, 255, 102, 0.55); }
        .fx-flash.hit { --fx: #ff3b3b; --fx-bg: rgba(255, 40, 40, 0.7); }
        .fx-flash.level { --fx: #ffd60a; --fx-bg: rgba(255, 214, 10, 0.5); }

        /* How the buttons reach the TV: straight over the Wi-Fi, or through the server */
        .controller-top .link {
            font-size: 9px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 2px solid #8892b0;
            color: #8892b0;
            white-space: nowrap;
        }
        .controller-top .link.direct { border-color: #00ff66; color: #00ff66; text-shadow: 0 0 6px #00ff66; }

        .ready-button { width: 100%; max-width: 320px; font-size: 22px; padding: 26px; }
        .ready-button.on { background: rgba(0, 0, 0, 0.5); border-color: #00ff66; color: #00ff66; font-size: 14px; box-shadow: 0 0 20px rgba(0, 255, 102, 0.4); }
        .solo-button { width: 100%; max-width: 320px; font-size: 12px; padding: 16px; background: rgba(0, 0, 0, 0.45); border-color: #ffd60a; color: #ffd60a; }
        .rematch-button { width: 100%; max-width: 320px; font-size: 18px; padding: 22px; }
        .rematch-button.waiting { background: rgba(0, 0, 0, 0.5); border-color: #00ff66; color: #00ff66; font-size: 12px; }
        .rematch-button.asked { animation: pulse 0.8s ease-in-out infinite alternate; }
        .rematch-status { min-height: 1.8em; color: #ffd60a; }

        /* Phone or controller (a game controller on the TV computer) */
        #waitScreen { overflow-y: auto; justify-content: safe center; }
        .input-choice { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }
        .input-label { font-size: 10px; color: #9fb3ff; }
        .input-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-option {
            font-family: inherit;
            font-size: 11px;
            padding: 14px 6px;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.45);
            color: #cfd8ff;
        }
        .input-option.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px var(--accent-soft); text-shadow: 0 0 8px var(--accent); }
        .pad-picker { display: flex; flex-direction: column; gap: 10px; }
        .pad-list { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 320px; }
        .pad-item {
            font-family: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 10px;
            text-align: left;
        }
        .pad-item small { flex: none; font-size: 8px; color: #9fb3ff; }
        .pad-item.mine { border-color: #00ff66; color: #00ff66; box-shadow: 0 0 12px rgba(0, 255, 102, 0.35); }
        .pad-item.mine small { color: #00ff66; }
        .pad-item:disabled { opacity: 0.45; }
        .pad-hint { font-size: 10px; line-height: 1.8; color: #ffd60a; max-width: 320px; }
        .pad-hint.ok { color: #00ff66; }
        /* Playing with a controller: no buttons on the phone, just whose controller it is */
        .pad-panel { display: none; }
        #controllerScreen.use-pad .pad { display: none; }
        #controllerScreen.use-pad .pad-panel {
            flex: 0 0 60%;
            width: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 0 16px max(16px, env(safe-area-inset-bottom));
            overflow-y: auto;
        }
        #controllerScreen.show-game.use-pad .pad-panel { flex: 0 0 auto; max-height: 45%; justify-content: flex-start; }
        .pad-panel-title { font-size: 16px; line-height: 1.5; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .switch-button { font-family: inherit; font-size: 10px; padding: 12px 16px; border-radius: 10px; border: 2px solid #9fb3ff; background: transparent; color: #9fb3ff; }

        /* Show my own board on this phone (a switch on the waiting screen and at the top of the pad) */
        .board-toggle {
            font-family: inherit;
            width: 100%;
            max-width: 320px;
            font-size: 10px;
            line-height: 1.6;
            padding: 14px 10px;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.45);
            color: #cfd8ff;
        }
        .board-toggle.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 16px var(--accent-soft); }
        .board-toggle:disabled { opacity: 0.75; }
        .board-note { font-size: 9px; line-height: 1.6; color: #ffd60a; }
        .board-note:empty { display: none; }
        .controller-top .board-switch {
            font-family: inherit;
            font-size: 9px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 2px solid #8892b0;
            background: transparent;
            color: #8892b0;
            white-space: nowrap;
        }
        .controller-top .board-switch.on { border-color: var(--accent); color: var(--accent); }
        /* 🐞: something glitched - mark it in the game log */
        .controller-top .bug-switch { font-family: inherit; font-size: 14px; padding: 2px 6px; border-radius: 8px; border: 2px solid #8892b0; background: transparent; line-height: 1.4; }
        .controller-top .bug-switch.marked { border-color: #ffd60a; background: rgba(255, 214, 10, 0.25); }
        /* ⏸: pause the whole TV game; while it's paused the pad dims */
        .controller-top .pause-switch { color: #fff; }
        .controller-top .pause-switch.on { border-color: #ffd60a; color: #ffd60a; background: rgba(255, 214, 10, 0.25); }
        #controllerScreen.paused .pad { opacity: 0.35; }
        #controllerScreen.paused #padHint { color: #ffd60a; }

        /* Teams match: pick a team before READY */
        .team-choice { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
        .team-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .team-button {
            font-family: inherit;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 6px;
            border-radius: 12px;
            border: 3px solid var(--team);
            background: rgba(0, 0, 0, 0.45);
            color: var(--team);
            font-size: 11px;
        }
        .team-button small { font-size: 7px; line-height: 1.5; color: #cfd8ff; opacity: 0.8; }
        .team-button.mine { background: var(--team); color: #0b0f24; box-shadow: 0 0 18px var(--team); }
        .team-button.mine small { color: #0b0f24; }
        .controller-info .big-name .team-label { font-size: 11px; padding: 6px 10px; border-radius: 8px; color: #0b0f24; text-shadow: none; }

        /* Results */
        .result-title { font-size: 34px; line-height: 1.3; }
        .result-title.win { color: #00ff00; text-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00; animation: pulse 1.2s ease-in-out infinite alternate; }
        .result-title.lose { color: #ff4444; text-shadow: 0 0 20px #ff4444, 0 0 40px #ff4444; }
        .result-emoji { font-size: 72px; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
    </style>
</head>
<body>
    <!-- Enter your name -->
    <section id="joinScreen" class="screen">
        <div class="badge" id="joinBadge">PLAYER ?</div>
        <h1>DR. MARIO 99<br>TV ROOM</h1>
        <form id="nameForm" autocomplete="off">
            <input id="nameInput" maxlength="16" placeholder="YOUR NAME" autocapitalize="words" enterkeyhint="done" required>
            <button class="big-button" id="joinButton" type="submit">JOIN</button>
        </form>
        <div class="error" id="joinError"></div>
    </section>

    <!-- Joined, waiting for the TV to start -->
    <section id="waitScreen" class="screen hidden">
        <div class="badge" id="waitBadge">PLAYER ?</div>
        <h1 id="waitName"></h1>
        <p id="waitText">You're in! Press READY.<br>The game starts when everyone is ready.</p>
        <div class="team-choice hidden" id="teamChoice">
            <div class="input-label">PICK YOUR TEAM</div>
            <div class="team-buttons" id="teamButtons"></div>
        </div>
        <div class="input-choice" id="inputChoice">
            <div class="input-label">PLAY WITH</div>
            <div class="input-buttons">
                <button class="input-option" type="button" data-input="phone">📱 PHONE</button>
                <button class="input-option" type="button" data-input="controller">🎮 CONTROLLER</button>
            </div>
            <div class="pad-picker hidden" id="padPicker">
                <div class="pad-hint" data-pad-hint></div>
                <div class="pad-list" data-pad-list></div>
            </div>
            <button class="board-toggle" type="button" data-board-toggle="wait"></button>
            <div class="board-note" id="boardNote"></div>
        </div>
        <button class="big-button ready-button" id="readyButton" type="button">READY</button>
        <button class="big-button solo-button hidden" id="soloButton" type="button">▶ PLAY SOLO</button>
        <p id="readyStatus" class="rematch-status"></p>
    </section>

    <!-- The controller -->
    <section id="controllerScreen" class="screen hidden">
        <div class="controller-info">
            <div class="controller-top">
                <span class="badge" id="padBadge">P?</span>
                <span class="top-name" id="topName"></span>
                <button class="board-switch" type="button" data-board-toggle="pad" title="Show your own board on this phone"></button>
                <button class="bug-switch pause-switch" type="button" id="pauseButton" title="Pause the game for everyone">⏸</button>
                <button class="bug-switch" type="button" id="bugButton" title="Something glitched? Mark this moment in the game log">🐞</button>
                <span class="link" id="linkBadge" title="How your buttons reach the TV">☁ SERVER</span>
            </div>
            <div class="big-name"><span id="padName"></span><small id="padHint">WATCH THE TV</small><small class="team-label hidden" id="padTeam"></small></div>
        </div>
        <div class="phone-game" id="phoneGame">
            <div class="side left">
                <div>SCORE<b id="gameScore">0</b></div>
                <div>VIRUS<b id="gameVirus">0</b></div>
                <div>LEVEL<b id="gameLevel">00</b></div>
            </div>
            <div class="board-wrap" id="boardWrap"><canvas id="boardCanvas" width="192" height="408"></canvas><div class="junk-layer" id="junkLayer"></div></div>
            <div class="side right">
                <div>NEXT<span class="next" id="gameNext"></span></div>
                <div id="gameTargetBox" class="hidden">TARGET<b id="gameTarget"></b></div>
            </div>
        </div>
        <div class="pad">
            <button class="hold" data-action="hold" aria-label="Hold pill">
                HOLD <span class="hold-box" id="holdBox"><span class="empty">EMPTY</span></span>
            </button>
            <button class="rotate" data-action="rotateLeft" aria-label="Rotate left">
                <svg viewBox="0 0 24 24"><path d="M7 8a7 7 0 1 1-1 8"></path><polyline points="12 8 7 8 7 3"></polyline></svg>
                ROTATE
            </button>
            <button class="rotate" data-action="rotateRight" aria-label="Rotate right">
                <svg viewBox="0 0 24 24"><path d="M17 8a7 7 0 1 0 1 8"></path><polyline points="12 8 17 8 17 3"></polyline></svg>
                ROTATE
            </button>
            <button class="move" data-action="left" aria-label="Move left">
                <svg viewBox="0 0 24 24"><line x1="20" y1="12" x2="4" y2="12"></line><polyline points="10 6 4 12 10 18"></polyline></svg>
                LEFT
            </button>
            <button class="move" data-action="right" aria-label="Move right">
                <svg viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"></line><polyline points="14 6 20 12 14 18"></polyline></svg>
                RIGHT
            </button>
            <button class="drop" data-action="drop" aria-label="Drop">
                <svg viewBox="0 0 24 24"><line x1="12" y1="4" x2="12" y2="20"></line><polyline points="6 14 12 20 18 14"></polyline></svg>
                DROP
            </button>
        </div>
        <div class="pad-panel" id="padPanel">
            <div class="pad-panel-title" id="padPanelTitle"></div>
            <div class="pad-hint" data-pad-hint></div>
            <div class="pad-list" data-pad-list></div>
            <button class="switch-button" id="usePhone" type="button">📱 USE MY PHONE INSTEAD</button>
        </div>
    </section>

    <!-- Victory / game over / out -->
    <section id="resultScreen" class="screen hidden">
        <div class="result-emoji" id="resultEmoji"></div>
        <div class="result-title" id="resultTitle"></div>
        <p id="resultMessage"></p>
        <button class="big-button rematch-button" id="rematchButton" type="button">🔁 REMATCH</button>
        <button class="big-button solo-button" id="shareButton" type="button">📣 SHARE THIS GAME</button>
        <p id="rematchStatus" class="rematch-status"></p>
        <p id="resultNext" class="hidden">Scan the new QR code on the TV to play again.</p>
    </section>

    <!-- Room closed or full -->
    <section id="errorScreen" class="screen hidden">
        <h1>HOLD ON</h1>
        <p id="errorMessage"></p>
    </section>

    <script src="/socket.io/socket.io.min.js"></script>
    <script>
        const MAX_PLAYERS = 20;
        const params = new URLSearchParams(location.search);
        const code = (params.get('room') || '').toUpperCase();
        let player = Math.min(Math.max(parseInt(params.get('player'), 10) || 1, 1), MAX_PLAYERS);
        // Single player on the computer with this phone as the controller: no name, no READY
        const soloPhone = params.get('solo') === '1';
        let myName = '';
        let joined = false;
        let screen = 'join';
        let showGame = false;
        // Play on this phone, or with a game controller on the TV computer (it remembers)
        let inputMode = 'phone';
        try { if (!soloPhone && localStorage.getItem('tvInput') === 'controller') inputMode = 'controller'; } catch (e) {}
        let padState = { list: [], bindings: {} }; // the TV's controllers, and whose they are
        // Show my own board on this phone (it remembers); always on with more than BOARD_FORCED_ABOVE players
        const BOARD_FORCED_ABOVE = 4;
        // Teams match: names and colours (same list in scripts/tvHost.js)
        const TEAMS = [['RED', '#ff4d6d'], ['BLUE', '#4dc3ff'], ['GREEN', '#00ff66'], ['YELLOW', '#ffd60a'], ['PURPLE', '#c77dff'], ['ORANGE', '#ff9f1c'], ['TEAL', '#2ee6d6'], ['PINK', '#ff70d9']];
        let lobbyTeams = 0; // how many teams in the lobby (0 = everyone for themselves)
        let wantsBoard = false;
        try { wantsBoard = localStorage.getItem('tvShowGame') === '1'; } catch (e) {}
        let boardForced = false;
        const $ = id => document.getElementById(id);
        const logQueue = []; // game log events waiting to go to the server (see Game log below)

        // Identifies this phone so it gets its slot back after the screen locks
        function getClientId() {
            try {
                let id = localStorage.getItem('tvClientId');
                if (!id) {
                    id = Math.random().toString(36).slice(2) + Date.now().toString(36);
                    localStorage.setItem('tvClientId', id);
                }
                return id;
            } catch (e) {
                return window.__tvClientId || (window.__tvClientId = Math.random().toString(36).slice(2));
            }
        }
        const clientId = getClientId();

        function show(id) {
            if (screen !== id) plog('screen', { id });
            screen = id;
            for (const el of document.querySelectorAll('.screen')) el.classList.add('hidden');
            $(id + 'Screen').classList.remove('hidden');
            if (id === 'controller') { fitBoard(); requestAnimationFrame(fitBoard); }
        }

        function setPlayer(n) {
            player = n;
            for (let i = 1; i <= MAX_PLAYERS; i++) document.body.classList.remove('p' + i);
            document.body.classList.add('p' + n);
            $('joinBadge').textContent = 'PLAYER ' + n;
            $('waitBadge').textContent = 'PLAYER ' + n;
            $('padBadge').textContent = 'P' + n;
        }
        setPlayer(player);

        try { $('nameInput').value = localStorage.getItem('tvName') || ''; } catch (e) {}

        if (!code) {
            $('errorMessage').textContent = 'This link has no room code. Scan the QR code on the TV.';
            show('error');
        }

        // WebSocket straight away (no long-polling first); fall back to polling if a network blocks it
        const socket = io(location.origin, { transports: ['websocket'], reconnectionDelayMax: 2000 });
        socket.on('connect_error', () => {
            if (socket.io.opts.transports[0] === 'websocket') socket.io.opts.transports = ['polling', 'websocket'];
        });

        /* ---------- Game log ---------- */

        // What happens on this phone goes into the TV game's log on the server (gameLogs.js):
        // button presses and how they were sent, the direct link, the phone sleeping,
        // reconnects, errors. 🐞 marks the moment something looked wrong.
        function plog(type, details = {}) {
            logQueue.push({ ct: Date.now(), type, ...details });
            if (logQueue.length > 3000) logQueue.splice(0, logQueue.length - 3000);
        }
        setInterval(() => { if (logQueue.length && socket.connected) socket.emit('log', logQueue.splice(0, 1000)); }, 1000);
        window.addEventListener('error', (e) => plog('error', { message: e.message, source: e.filename, line: e.lineno, stack: e.error && e.error.stack ? String(e.error.stack).slice(0, 1500) : null }));
        window.addEventListener('unhandledrejection', (e) => plog('error', { message: 'Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) }));
        document.addEventListener('visibilitychange', () => plog(document.hidden ? 'phone-hidden' : 'phone-shown'));
        socket.on('connect', () => plog('socket-connected', { id: socket.id }));
        socket.on('disconnect', (reason) => plog('socket-disconnected', { reason }));
        setInterval(() => {
            if (joined && socket.connected) socket.emit('logPing', Date.now(), (sent) => plog('ping', { ms: Date.now() - sent }));
        }, 10000);
        for (const event of ['tvJoined', 'tvJoinError', 'tvGameStarted', 'tvResult', 'tvEliminated', 'tvRoomClosed', 'tvFx']) {
            socket.on(event, (data) => plog('got-' + event, { data: JSON.stringify(data || null).slice(0, 400) }));
        }
        plog('phone-loaded', { ua: navigator.userAgent, screen: { w: innerWidth, h: innerHeight }, soloPhone, room: code });
        $('bugButton').addEventListener('click', () => {
            socket.emit('logMark', { note: 'from the phone' });
            const button = $('bugButton');
            button.classList.add('marked');
            setTimeout(() => button.classList.remove('marked'), 1500);
            if (navigator.vibrate) navigator.vibrate([30, 30, 30]);
        });

        function join() {
            socket.emit('tvJoin', { code, player, name: myName, clientId, input: inputMode, showGame: wantsBoard });
        }

        if (soloPhone && code) {
            try { myName = localStorage.getItem('tvName') || ''; } catch (e) {}
            myName = myName || 'PLAYER 1';
            $('waitName').textContent = 'PHONE CONTROLLER';
            $('waitText').textContent = 'Connecting to the game...';
            $('readyButton').classList.add('hidden');
            $('padHint').textContent = 'WATCH THE SCREEN';
            show('wait');
            join();
        }

        $('nameForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = $('nameInput').value.trim().replace(/\s+/g, ' ');
            if (!name) {
                $('joinError').textContent = 'Enter your name.';
                return;
            }
            myName = name;
            try { localStorage.setItem('tvName', name); } catch (e) {}
            $('joinButton').disabled = true;
            $('joinError').textContent = '';
            join();
        });

        socket.on('connect', () => {
            // Came back after the phone slept or the Wi-Fi blinked: take the same slot again
            if (joined) join();
        });

        socket.on('tvJoined', (data) => {
            joined = true;
            myName = data.name;
            setPlayer(data.player);
            $('joinButton').disabled = false;
            $('waitName').textContent = soloPhone ? 'PHONE CONTROLLER' : data.name;
            if (soloPhone) $('waitText').textContent = 'Connected! The game is starting on the computer.';
            $('padName').textContent = data.name;
            $('topName').textContent = data.name;
            if (data.controllers) padState = data.controllers;
            renderInput();
            setBoard();
            openDirect();
            if (data.result) showResult(data.result);
            else if (data.eliminated) showOut(data.eliminated);
            else if (data.state === 'playing' && data.inGame) startController(data.boardForced);
            else if (data.state === 'lobby') show('wait');
            else {
                $('errorMessage').textContent = 'A game is on. Wait for the next QR code on the TV.';
                show('error');
            }
        });

        socket.on('tvJoinError', (data) => {
            $('joinButton').disabled = false;
            if (data.reason === 'name') {
                $('joinError').textContent = data.message;
                return;
            }
            joined = false;
            if (screen === 'result') {
                $('rematchButton').classList.add('hidden');
                $('resultNext').classList.remove('hidden');
                return;
            }
            $('errorMessage').textContent = data.message;
            show('error');
        });

        socket.on('tvGameStarted', (data) => {
            releaseAll();
            $('resultNext').classList.add('hidden');
            showMyTeam(data.teams && data.teams.of ? data.teams.of[player] : null);
            startController(data.boardForced);
        });

        /* ---------- Teams match ---------- */

        function myLobbyTeam() {
            const me = lobbyPlayers.find(p => p.player === player);
            return me && me.team != null ? me.team : null;
        }
        function renderTeams() {
            $('teamChoice').classList.toggle('hidden', !lobbyTeams || soloPhone);
            const buttons = $('teamButtons');
            buttons.innerHTML = '';
            const mine = myLobbyTeam();
            for (let t = 0; t < lobbyTeams; t++) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'team-button' + (mine === t ? ' mine' : '');
                button.style.setProperty('--team', TEAMS[t][1]);
                const members = lobbyPlayers.filter(p => p.team === t).map(p => p.name);
                button.innerHTML = '<span></span><small></small>';
                button.querySelector('span').textContent = (mine === t ? '✔ ' : '') + TEAMS[t][0];
                button.querySelector('small').textContent = members.length ? members.join(', ') : 'nobody yet';
                button.addEventListener('click', () => {
                    socket.emit('tvPickTeam', { team: t });
                    if (navigator.vibrate) navigator.vibrate(15);
                });
                buttons.appendChild(button);
            }
        }
        function showMyTeam(team) {
            const label = $('padTeam');
            label.classList.toggle('hidden', team == null || !TEAMS[team]);
            if (team == null || !TEAMS[team]) return;
            label.textContent = 'TEAM ' + TEAMS[team][0];
            label.style.background = TEAMS[team][1];
        }

        function startController(forced) {
            boardForced = !!forced;
            lastGrid = null;
            applyState({ h: null, hu: false, t: null });
            clearBoard();
            setBoard();
            renderInput();
            show('controller');
        }

        /* ---------- My board on this phone ---------- */

        function setBoard() {
            const on = wantsBoard || boardForced;
            if (on && !showGame) {
                lastGrid = null; // the TV sends the whole board next
                clearBoard();
            }
            showGame = on;
            $('controllerScreen').classList.toggle('show-game', on);
            document.body.classList.toggle('show-game', on);
            for (const button of document.querySelectorAll('[data-board-toggle]')) {
                button.classList.toggle('on', on);
                button.disabled = boardForced;
                button.classList.toggle('hidden', soloPhone);
                button.textContent = button.dataset.boardToggle === 'pad'
                    ? (on ? '▣ BOARD' : '▢ BOARD')
                    : (on ? '✅' : '⬜') + ' SHOW MY GAME ON THIS PHONE';
            }
            $('boardNote').textContent = boardForced ? 'Always on with ' + (BOARD_FORCED_ABOVE + 1) + ' or more players.' : '';
            if (screen === 'controller') {
                fitBoard();
                requestAnimationFrame(fitBoard);
            }
        }
        for (const button of document.querySelectorAll('[data-board-toggle]')) {
            button.addEventListener('click', () => {
                if (boardForced) return;
                wantsBoard = !wantsBoard;
                try { localStorage.setItem('tvShowGame', wantsBoard ? '1' : '0'); } catch (e) {}
                socket.emit('tvShowGame', { on: wantsBoard });
                setBoard();
                if (navigator.vibrate) navigator.vibrate(15);
            });
        }

        /* ---------- Ready ---------- */

        // When everyone in is ready, the TV starts the game by itself.
        // Alone in the room: PLAY SOLO starts a one-player game.
        let iAmReady = false;
        let lobbyPlayers = [];
        $('readyButton').addEventListener('click', () => {
            iAmReady = !iAmReady;
            socket.emit('tvReady', { ready: iAmReady });
            showReady();
            if (navigator.vibrate) navigator.vibrate(20);
        });
        $('soloButton').addEventListener('click', () => {
            iAmReady = true;
            socket.emit('tvReady', { ready: true, solo: true });
            $('readyStatus').textContent = 'Starting!';
            if (navigator.vibrate) navigator.vibrate(20);
        });
        function showReady() {
            if (soloPhone) return; // starts by itself
            const button = $('readyButton');
            button.classList.toggle('on', iAmReady);
            button.textContent = iAmReady ? 'READY ✔' : 'READY';
            // Teams match: pick a team before you can be ready
            const needTeam = lobbyTeams > 0 && myLobbyTeam() == null && !iAmReady;
            button.disabled = needTeam;
            const others = lobbyPlayers.filter(p => p.player !== player);
            $('soloButton').classList.toggle('hidden', others.length > 0);
            const status = $('readyStatus');
            const waitingOn = others.filter(p => p.connected && !p.ready);
            if (!others.length) status.textContent = 'Waiting for others to join...';
            else if (needTeam) status.textContent = 'Pick a team, then press READY.';
            else if (!waitingOn.length) status.textContent = iAmReady ? 'Starting!'
                : others.length === 1 ? others[0].name + ' is ready!' : 'Everyone else is ready!';
            else if (waitingOn.length === 1) status.textContent = 'Waiting for ' + waitingOn[0].name + ' to press READY...';
            else status.textContent = 'Waiting for ' + waitingOn.length + ' players to press READY...';
        }
        socket.on('tvLobby', ({ players, teams }) => {
            lobbyPlayers = players;
            lobbyTeams = teams || 0;
            renderTeams();
            renderInput();
            // Waiting to start: with this many players every phone will show its board
            if (screen === 'wait') {
                boardForced = players.length > BOARD_FORCED_ABOVE;
                setBoard();
            }
            if (screen !== 'wait') return;
            const me = players.find(p => p.player === player);
            iAmReady = !!(me && me.ready);
            showReady();
        });

        /* ---------- Phone or controller ---------- */

        // CONTROLLER: press A on a controller connected to the TV computer, or tap it in
        // the list. The TV says which controllers it has and whose they are.
        function chooseInput(mode) {
            if (soloPhone || mode === inputMode) return;
            inputMode = mode;
            try { localStorage.setItem('tvInput', mode); } catch (e) {}
            if (mode === 'controller') releaseAll();
            socket.emit('tvChooseInput', { input: mode });
            renderInput();
            if (navigator.vibrate) navigator.vibrate(15);
        }
        for (const button of document.querySelectorAll('.input-option')) {
            button.addEventListener('click', () => chooseInput(button.dataset.input));
        }
        $('usePhone').addEventListener('click', () => chooseInput('phone'));

        let hadController = false;
        function renderInput() {
            const usePad = inputMode === 'controller';
            for (const button of document.querySelectorAll('.input-option')) button.classList.toggle('on', button.dataset.input === inputMode);
            $('inputChoice').classList.toggle('hidden', soloPhone);
            $('padPicker').classList.toggle('hidden', !usePad);
            $('controllerScreen').classList.toggle('use-pad', usePad);
            const mine = padState.list.find(c => padState.bindings[c.key] === player);
            if (mine && !hadController && navigator.vibrate) navigator.vibrate([40, 40, 40]);
            hadController = !!mine;
            const hint = mine ? '✅ ' + mine.name + ' is yours. Its lights show your player number.'
                : padState.list.length ? 'Press A on your controller, or tap it below.'
                : 'No controllers on the TV yet. Pair one with the TV computer over Bluetooth, then press A on it.';
            for (const el of document.querySelectorAll('[data-pad-hint]')) {
                el.textContent = hint;
                el.classList.toggle('ok', !!mine);
            }
            $('padPanelTitle').textContent = mine ? '🎮 ' + mine.name.toUpperCase() : '🎮 PRESS A ON YOUR CONTROLLER';
            for (const el of document.querySelectorAll('[data-pad-list]')) {
                el.innerHTML = '';
                for (const c of padState.list) {
                    const owner = padState.bindings[c.key];
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'pad-item' + (owner === player ? ' mine' : '');
                    item.disabled = !!owner && owner !== player;
                    const name = document.createElement('span');
                    name.textContent = c.name;
                    const status = document.createElement('small');
                    status.textContent = owner === player ? 'YOURS ✔' : owner ? nameOfPlayer(owner) : 'TAP TO USE';
                    item.append(name, status);
                    item.addEventListener('click', () => {
                        if (owner !== player) socket.emit('tvPickController', { key: c.key });
                    });
                    el.appendChild(item);
                }
            }
        }
        function nameOfPlayer(n) {
            const p = lobbyPlayers.find(q => q.player === n);
            return p ? p.name : 'PLAYER ' + n;
        }
        socket.on('tvControllers', (state) => {
            padState = state && Array.isArray(state.list) ? state : { list: [], bindings: {} };
            renderInput();
        });

        /* ---------- Board from the TV ---------- */

        // One character per cell: '.' empty, 'a' + index into this list.
        // Same list as SPRITE_CODES in scripts/components.js - change both together.
        const SPRITES = [];
        for (const color of ['bl', 'br', 'yl'])
            for (const kind of ['dot', 'covid', 'left', 'right', 'up', 'down', 'x', 'o'])
                SPRITES.push(color + '_' + kind);
        const spriteImages = SPRITES.map(name => {
            const img = new Image();
            img.onload = () => { if (lastGrid) drawBoard(lastGrid); };
            img.src = '/img/' + name + '.png';
            return img;
        });
        const canvas = $('boardCanvas');
        const ctx = canvas.getContext('2d');
        let lastGrid = null;

        function clearBoard() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        function drawBoard(grid) {
            ctx.imageSmoothingEnabled = false;
            clearBoard();
            for (let i = 0; i < grid.length; i++) {
                const ch = grid.charCodeAt(i);
                if (ch === 46) continue; // '.'
                const img = spriteImages[ch - 97];
                if (img && img.complete && img.naturalWidth) ctx.drawImage(img, (i % 8) * 24, Math.floor(i / 8) * 24, 24, 24);
            }
        }
        // Biggest board that fits its space, keeping the bottle's 8 x 17 shape
        function fitBoard() {
            if (!showGame) return;
            const wrap = $('phoneGame');
            const side = 2 * 64 + 20; // room for the score and NEXT columns
            let h = wrap.clientHeight - 16;
            let w = Math.round(h * 8 / 17);
            if (w > wrap.clientWidth - side) {
                w = Math.max(80, wrap.clientWidth - side);
                h = Math.round(w * 17 / 8);
            }
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            $('junkLayer').style.width = w + 'px';
            $('junkLayer').style.height = h + 'px';
        }
        window.addEventListener('resize', fitBoard);

        function pillImages(colors, size) {
            const frag = document.createDocumentFragment();
            for (const [color, side] of [[colors[0], 'left'], [colors[1], 'right']]) {
                const img = document.createElement('img');
                img.src = '/img/' + color + '_' + side + '.png';
                img.alt = '';
                frag.appendChild(img);
            }
            return frag;
        }

        let lastHold = '';
        let lastJunk = null;
        function applyState(state) {
            // HOLD: on the button, dimmed once it's been used for this pill
            const holdKey = JSON.stringify([state.h, state.hu]);
            if (holdKey !== lastHold) {
                lastHold = holdKey;
                const box = $('holdBox');
                box.innerHTML = '';
                if (state.h) box.appendChild(pillImages(state.h));
                else box.innerHTML = '<span class="empty">EMPTY</span>';
                document.querySelector('.pad .hold').classList.toggle('used', !!state.hu);
            }
            // Pause: someone paused the TV game (this phone, another one, a controller or the TV)
            $('controllerScreen').classList.toggle('paused', !!state.paused);
            $('pauseButton').classList.toggle('on', !!state.paused);
            $('pauseButton').textContent = state.paused ? '▶' : '⏸';
            $('padHint').innerHTML = '';
            if (state.paused) {
                $('padHint').textContent = '⏸ PAUSED - PRESS ▶ TO PLAY';
            } else if (state.t) {
                $('padHint').append('TARGET ▸ ');
                const t = document.createElement('span');
                t.className = 'target';
                t.textContent = state.t;
                $('padHint').appendChild(t);
            } else {
                $('padHint').textContent = soloPhone ? 'WATCH THE SCREEN' : 'WATCH THE TV';
            }
            if (!showGame) return;
            $('gameTargetBox').classList.toggle('hidden', !state.t);
            $('gameTarget').textContent = state.t || '';
            if (typeof state.s === 'number') $('gameScore').textContent = state.s;
            if (typeof state.v === 'number') $('gameVirus').textContent = String(state.v).padStart(2, '0');
            if (typeof state.l === 'number') $('gameLevel').textContent = String(state.l).padStart(2, '0');
            const next = $('gameNext');
            const nextKey = JSON.stringify(state.n || null);
            if (next.dataset.key !== nextKey) {
                next.dataset.key = nextKey;
                next.innerHTML = '';
                if (state.n) next.appendChild(pillImages(state.n));
            }
            const junkKey = JSON.stringify(state.j || null);
            if (state.g && junkKey !== lastJunk) {
                lastJunk = junkKey;
                $('junkLayer').innerHTML = '';
                for (const [x, color] of state.j || []) {
                    const img = document.createElement('img');
                    img.src = 'img/' + color + '_covid.png';
                    img.alt = '';
                    img.style.left = (x * 100 / 8) + '%';
                    $('junkLayer').appendChild(img);
                }
            }
            if (state.g && state.g !== lastGrid) {
                lastGrid = state.g;
                drawBoard(state.g);
            }
        }
        socket.on('tvState', (state) => { if (screen === 'controller') applyState(state); });

        /* ---------- Results ---------- */

        // Rematch: when every player asks, the TV starts the next game by itself
        let iAskedRematch = false;
        let lastResult = null;
        $('rematchButton').addEventListener('click', () => {
            if (iAskedRematch) return;
            iAskedRematch = true;
            socket.emit('tvRematch');
            showRematch([player]);
            if (navigator.vibrate) navigator.vibrate(20);
        });
        function showRematch(players) {
            const button = $('rematchButton');
            const status = $('rematchStatus');
            const roster = (lastResult && lastResult.roster) || [player];
            const names = (lastResult && lastResult.names) || {};
            const mine = players.includes(player);
            const asked = players.filter(n => n !== player);
            const pending = roster.filter(n => !players.includes(n));
            iAskedRematch = mine;
            button.disabled = mine;
            button.classList.toggle('waiting', mine);
            button.classList.toggle('asked', !mine && asked.length > 0);
            button.textContent = !mine ? (roster.length === 1 ? '🔁 PLAY AGAIN' : '🔁 REMATCH')
                : pending.length === 0 ? 'STARTING...'
                : 'WAITING FOR ' + (pending.length === 1 ? names[pending[0]] || 'THE OTHER PLAYER' : pending.length + ' PLAYERS') + '...';
            status.textContent = mine && !pending.length ? 'Starting!'
                : !mine && asked.length === 1 ? (names[asked[0]] || 'Someone') + ' wants a rematch!'
                : !mine && asked.length > 1 ? asked.length + ' of ' + roster.length + ' want a rematch!'
                : '';
        }
        socket.on('tvRematch', ({ players }) => showRematch(players));

        socket.on('tvResult', showResult);
        socket.on('tvEliminated', showOut);

        // Out of a bigger game: the others play on; the final result comes later
        function showOut({ place, of }) {
            releaseAll();
            $('resultEmoji').textContent = '💀';
            $('resultTitle').textContent = "YOU'RE OUT";
            $('resultTitle').className = 'result-title lose';
            $('resultMessage').textContent = 'You finished #' + place + ' of ' + of + '. Watch the rest on the TV!';
            $('rematchButton').classList.add('hidden');
            $('rematchStatus').textContent = '';
            if (navigator.vibrate) navigator.vibrate([300]);
            show('result');
        }

        function showResult(result) {
            releaseAll();
            lastResult = result;
            $('rematchButton').classList.remove('hidden');
            showRematch(result.rematch || []);
            const title = $('resultTitle');
            if (result.solo) {
                $('resultEmoji').textContent = '💀';
                title.textContent = 'GAME OVER';
                title.className = 'result-title lose';
                $('resultMessage').textContent = 'You reached level ' + String(result.solo.level).padStart(2, '0') + ' with ' + result.solo.score + ' points.';
            } else if (result.team != null && TEAMS[result.team]) {
                // Teams match
                const teamName = 'TEAM ' + TEAMS[result.team][0];
                $('resultEmoji').textContent = result.won ? '🏆' : '💀';
                title.textContent = result.won ? 'VICTORY!' : 'GAME OVER';
                title.className = 'result-title ' + (result.won ? 'win' : 'lose');
                $('resultMessage').textContent = result.won ? teamName + ' wins! Nice work, ' + myName + '!' : teamName + ' won this one.';
            } else if (result.won) {
                $('resultEmoji').textContent = '🏆';
                title.textContent = 'VICTORY!';
                title.className = 'result-title win';
                $('resultMessage').textContent = result.of > 2 ? 'You beat everyone, ' + myName + '!' : 'You beat the viruses first, ' + myName + '!';
            } else {
                $('resultEmoji').textContent = '💀';
                title.textContent = 'GAME OVER';
                title.className = 'result-title lose';
                $('resultMessage').textContent = (result.winnerName || 'Someone') + ' won this one.'
                    + (result.of > 2 && result.place ? ' You finished #' + result.place + ' of ' + result.of + '.' : '');
            }
            if (navigator.vibrate) navigator.vibrate(result.won ? [80, 60, 80, 60, 200] : [400]);
            show('result');
        }

        // You sent junk, junk hit you, or you cleared a level: flash the screen (the pad keeps working underneath)
        // An attack looks like the pill that was cleared to send it (same colours as scripts/attackFx.js)
        const PILL_FX = { bl: ['#6f9bff', 'rgba(111, 155, 255, 0.65)'], br: ['#e0642e', 'rgba(224, 100, 46, 0.65)'], yl: ['#ffe45c', 'rgba(255, 228, 92, 0.6)'] };
        socket.on('tvFx', ({ kind, pill }) => {
            if (screen !== 'controller') return;
            const el = document.createElement('div');
            el.className = 'fx-flash ' + kind;
            if (PILL_FX[pill]) {
                el.style.setProperty('--fx', PILL_FX[pill][0]);
                el.style.setProperty('--fx-bg', PILL_FX[pill][1]);
            }
            const label = document.createElement('span');
            label.textContent = kind === 'attack' ? 'ATTACK SENT!' : kind === 'level' ? 'LEVEL CLEAR!' : 'INCOMING!';
            el.appendChild(label);
            document.body.appendChild(el);
            const anim = el.animate([
                { opacity: 0, transform: 'scale(1.15)' },
                { opacity: 1, transform: 'scale(1)', offset: 0.1 },
                { opacity: 1, transform: 'scale(1)', offset: 0.55 },
                { opacity: 0, transform: 'scale(1)' },
            ], { duration: kind === 'hit' ? 1000 : 800, easing: 'ease-out' });
            anim.onfinish = () => el.remove();
            if (navigator.vibrate) navigator.vibrate(kind === 'hit' ? [120, 60, 120] : 30);
        });

        socket.on('tvRoomClosed', () => {
            joined = false;
            releaseAll();
            closeDirect();
            if (screen === 'result') {
                // The room is gone, so there is nothing to rematch in
                $('rematchButton').classList.add('hidden');
                $('rematchStatus').textContent = '';
                $('resultNext').classList.remove('hidden');
            } else {
                $('errorMessage').textContent = 'The TV closed this room. Scan the new QR code on the TV.';
                show('error');
            }
        });

        /**
         * Direct link to the TV (WebRTC data channel). The server only passes the
         * set-up messages; after that, presses go straight from this phone to the
         * TV page over the Wi-Fi they share, and the TV sends the board back the
         * same way. If it can't connect, both keep going through the server.
         */
        let pc = null;
        let channel = null;
        function closeDirect() {
            if (channel) { try { channel.close(); } catch (e) {} }
            if (pc) { try { pc.close(); } catch (e) {} }
            pc = null;
            channel = null;
            showLink('server');
        }
        function showLink(kind) {
            const el = $('linkBadge');
            el.classList.toggle('direct', kind !== 'server');
            el.textContent = kind === 'direct' ? '⚡ DIRECT' : '☁ SERVER';
        }
        function openDirect() {
            if (!window.RTCPeerConnection) return;
            closeDirect();
            const myPc = pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            const myChannel = channel = pc.createDataChannel('input', { ordered: true });
            myChannel.onopen = () => { plog('direct-link', { open: true }); if (pc === myPc) showLink('direct'); };
            myChannel.onclose = () => { plog('direct-link', { open: false }); if (channel === myChannel) { channel = null; showLink('server'); } };
            myChannel.onmessage = (m) => {
                try {
                    const data = JSON.parse(m.data);
                    if (data.type === 'state' && screen === 'controller') applyState(data.state);
                } catch (e) {}
            };
            pc.onicecandidate = (e) => { if (e.candidate && pc === myPc) socket.emit('tvSignal', { candidate: e.candidate }); };
            pc.createOffer()
                .then(offer => myPc.setLocalDescription(offer))
                .then(() => { if (pc === myPc) socket.emit('tvSignal', { description: myPc.localDescription }); })
                .catch((e) => { plog('direct-link-failed', { message: e && e.message }); closeDirect(); });
        }
        // Apply the TV's answer before its network candidates, in the order they came
        let signalChain = Promise.resolve();
        socket.on('tvSignal', ({ description, candidate }) => {
            const myPc = pc;
            if (!myPc) return;
            signalChain = signalChain.then(() => description
                ? myPc.setRemoteDescription(description)
                : candidate && myPc.addIceCandidate(candidate)).catch(() => {});
        });

        /* ---------- Buttons ---------- */

        // Send "down" when pressed and "up" when released; the TV repeats while held
        const held = new Map(); // pointerId -> button
        function sendInput(action, pressed) {
            const direct = !!(channel && channel.readyState === 'open');
            plog('button', { action, pressed, via: direct ? 'direct' : 'server' });
            if (direct) channel.send(JSON.stringify({ action, pressed }));
            else socket.emit('tvInput', { action, pressed });
        }
        function press(button) {
            button.classList.add('down');
            sendInput(button.dataset.action, true);
            if (navigator.vibrate) navigator.vibrate(12);
        }
        function release(button) {
            button.classList.remove('down');
            sendInput(button.dataset.action, false);
        }
        $('pauseButton').addEventListener('click', () => {
            sendInput('pause', true);
            sendInput('pause', false);
            $('pauseButton').blur();
        });
        function releaseAll() {
            for (const button of new Set(held.values())) release(button);
            held.clear();
        }
        for (const button of document.querySelectorAll('.pad button')) {
            button.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                if (held.has(e.pointerId)) return;
                try { button.setPointerCapture(e.pointerId); } catch (err) {}
                const alreadyDown = [...held.values()].includes(button);
                held.set(e.pointerId, button);
                if (!alreadyDown) press(button);
            });
            const end = (e) => {
                if (held.get(e.pointerId) !== button) return;
                held.delete(e.pointerId);
                if (![...held.values()].includes(button)) release(button);
            };
            button.addEventListener('pointerup', end);
            button.addEventListener('pointercancel', end);
            button.addEventListener('lostpointercapture', end);
            button.addEventListener('contextmenu', (e) => e.preventDefault());
        }
        document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
        window.addEventListener('blur', releaseAll);
        // Stop double-tap zoom and pull-to-refresh on the pad
        document.addEventListener('touchmove', (e) => { if (screen === 'controller') e.preventDefault(); }, { passive: false });
    </script>
    <script src="/scripts/hello.js"></script>
    <script src="/scripts/share.js"></script>
    <script>document.getElementById('shareButton').onclick = function () { window.shareGame('tv-share', this) };</script>
</body>
